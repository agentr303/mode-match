# Builds every format on Windows and macOS, runs the tests and validates the plugins (pluginval; auval for the AU).
name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target ModeMatch_VST3 ModeMatch_CLAP ModeMatch_Standalone ModeMatchTests --parallel

      - name: Tests
        run: build/ModeMatchTests_artefacts/Release/ModeMatchTests.exe

      - name: pluginval (VST3, strictness 10)
        shell: pwsh
        run: |
          gh release download v1.0.4 -R Tracktion/pluginval -p pluginval_Windows.zip -D pluginval
          Expand-Archive pluginval/pluginval_Windows.zip -DestinationPath pluginval
          pluginval/pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 600000 `
            --validate "build/ModeMatch_artefacts/Release/VST3/Mode Match.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal: arm64 + x86_64)"
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --target ModeMatch_VST3 ModeMatch_AU ModeMatch_CLAP ModeMatch_Standalone ModeMatchTests --parallel

      - name: Tests
        run: build/ModeMatchTests_artefacts/Release/ModeMatchTests

      - name: pluginval (VST3 and AU, strictness 10) and auval
        run: |
          set -euo pipefail
          A=build/ModeMatch_artefacts/Release
          codesign --force --deep --sign - "$A/VST3/Mode Match.vst3" "$A/AU/Mode Match.component" "$A/CLAP/Mode Match.clap"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$A/AU/Mode Match.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Mdm1 Mdmh
          gh release download v1.0.4 -R Tracktion/pluginval -p pluginval_macOS.zip -D pluginval
          unzip -q pluginval/pluginval_macOS.zip -d pluginval
          PV=pluginval/pluginval.app/Contents/MacOS/pluginval
          "$PV" --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 600000 --validate "$A/VST3/Mode Match.vst3"
          "$PV" --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 600000 \
            --validate ~/Library/Audio/Plug-Ins/Components/"Mode Match.component"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package (ad-hoc signed, not notarised)
        run: |
          set -euo pipefail
          A=build/ModeMatch_artefacts/Release
          NAME="ModeMatch-${GITHUB_SHA::7}-macos-universal"
          mkdir -p "dist/${NAME}"
          codesign --force --deep --sign - "$A/Standalone/Mode Match.app"
          cp -R "$A/VST3/Mode Match.vst3" "$A/AU/Mode Match.component" "$A/CLAP/Mode Match.clap" "$A/Standalone/Mode Match.app" "dist/${NAME}/"
          cp LICENSE THIRD_PARTY_NOTICES.md "dist/${NAME}/"
          cp third_party/signalsmith-linear/LICENSE.txt "dist/${NAME}/signalsmith-linear-LICENSE.txt"
          cp build/_deps/ara_sdk-src/ARA_Library/LICENSE.txt "dist/${NAME}/ARA-LICENSE.txt"
          cp build/_deps/clap_juce_extensions-src/clap-libs/clap/LICENSE "dist/${NAME}/CLAP-LICENSE.txt"
          cp build/_deps/clap_juce_extensions-src/LICENSE.md "dist/${NAME}/clap-juce-extensions-LICENSE.txt"
          cat > "dist/${NAME}/README.txt" <<TXT
          Mode Match test build ${GITHUB_SHA::7} - macOS (Apple Silicon and Intel, macOS 11 or later)

          VST3:        copy "Mode Match.vst3" to ~/Library/Audio/Plug-Ins/VST3/
          AU:          copy "Mode Match.component" to ~/Library/Audio/Plug-Ins/Components/
          CLAP:        copy "Mode Match.clap" to ~/Library/Audio/Plug-Ins/CLAP/
          Standalone:  copy "Mode Match.app" to /Applications

          Not notarised by Apple, so macOS blocks it at first. In Terminal, clear the quarantine flag on what you installed:
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"Mode Match.vst3"
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/"Mode Match.component"
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/CLAP/"Mode Match.clap"
            xattr -dr com.apple.quarantine /Applications/"Mode Match.app"
          Then rescan plugins in your DAW.

          Source: commit ${GITHUB_SHA} at https://github.com/${GITHUB_REPOSITORY}. GNU AGPLv3 (LICENSE).
          TXT
          echo "NAME=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist
